modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
    modId = "nekoroqualityoflife"
    version = "${version}"
    displayName = "Nekoro Quality of Life"
    authors = "Alolan Xardas"
    description = '''
Small quality of life changes in config files: switch single enchantments on and off (Fortune and Silk Touch on one tool), hide toasts or move them to chat, unlock all recipes, hide the recipe book, auto walk, double doors, faster ladders, no creative drift, instant XP pickup, inventory sorting and transfer buttons, mouse shortcuts in inventories, refilling the item in hand, a hotbar swap key, cleaner tooltips, a Brightness slider up to fullbright, a short F3 screen, borderless fullscreen and a searchable Key Binds screen.
'''

[[dependencies.nekoroqualityoflife]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.nekoroqualityoflife]]
    modId = "minecraft"
    type = "required"
    versionRange = "[1.21.1,1.22)"
    ordering = "NONE"
    side = "BOTH"

[[mixins]]
    config = "nekoroqualityoflife.mixins.json"

[[accessTransformers]]
    file = "META-INF/accesstransformer.cfg"
